#jw{opacity:0;filter:blur(6px)}
#dot{transform-box:fill-box;transform-origin:center;transform:scale(0);fill:var(--gold)!important;stroke:none!important}
#sp{left:calc(540/10.8*1%);top:calc(370/10.8*1%);width:9%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);opacity:0;background:radial-gradient(circle,#fff 0,rgba(255,225,160,.9) 18%,transparent 62%);clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}
#soon,#sub{position:absolute;left:0;width:100%;text-align:center;color:var(--cream);opacity:0;white-space:nowrap}
#soon{top:77%;font-weight:300;font-size:calc(var(--w)*.062);padding-left:.4em}
#sub{top:84%;color:var(--gold);font-size:calc(var(--w)*.03);letter-spacing:.5em;padding-left:.5em}

.go #glow{animation:fadeIn 3s ease-out forwards,breathe 5s ease-in-out 3s infinite}
.go #logo{animation:push 13s linear forwards}
.go #ro{animation:draw 3s cubic-bezier(.5,0,.2,1) .4s forwards}
.go #ri{animation:draw 3.2s cubic-bezier(.5,0,.2,1) 1s forwards;stroke-opacity:.6}
.go .dm{animation:draw 1.1s ease-in-out var(--s) forwards}
.go .lt{animation:letter 1.1s cubic-bezier(.2,.7,.2,1) calc(3.3s + var(--i)*.2s) forwards}
.go #dl,.go #dr{animation:draw 1.2s ease-out 4.9s forwards}
.go #dot{animation:pop .7s cubic-bezier(.3,1.6,.5,1) 4.8s forwards}
.go #jw{animation:letter 1.6s ease-out 5.3s forwards}
.go #shim{animation:sweep 2.2s ease-in-out 6.2s 1 forwards,sweep 2.2s ease-in-out 9.6s 1 forwards}
.go #sp{animation:glint 1.4s ease-in-out 3.2s 1,glint 1.2s ease-in-out 7.6s 1}
.go #soon{animation:soon 2.4s cubic-bezier(.2,.7,.2,1) 7.2s forwards}
.go #ln{animation:ln 1.6s ease-out 7.6s forwards}
.go #sub{animation:fadeUp 1.6s ease-out 8.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes sweep{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0% 0}}
@keyframes glint{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.5) rotate(45deg)}}
@keyframes soon{from{opacity:0;letter-spacing:.15em;filter:blur(6px)}to{opacity:1;letter-spacing:.5em;filter:blur(0)}}
@keyframes ln{to{width:46%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#r{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:6px 20px;border-radius:20px;font:inherit;font-size:14px;letter-spacing:.25em;cursor:pointer;transition:opacity .4s}

<script>
const st=document.getElementById('stage'),c=document.getElementById('c'),x=c.getContext('2d'),btn=document.getElementById('r');
let W=1,H=1;
function size(){const d=devicePixelRatio||1;W=st.clientWidth;H=st.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);st.style.setProperty('--w',W+'px')}
size();addEventListener('resize',size);
const mk=(n,r0,r1,v0,v1)=>Array.from({length:n},()=>({x:Math.random(),y:Math.random(),r:r0+Math.random()*(r1-r0),v:v0+Math.random()*(v1-v0),p:Math.random()*6,s:Math.random()*.5+.5}));
const bokeh=mk(14,14,38,.00004,.00012),dust=mk(60,.6,2.2,.00015,.0005);
let t0=0;
(function loop(t){x.clearRect(0,0,W,H);const k=Math.min(1,Math.max(0,(t-t0)/1500));
for(const p of bokeh){p.y-=p.v*16;if(p.y<-.1){p.y=1.1;p.x=Math.random()}
const a=k*.05*(.6+.4*Math.sin(t/1500+p.p));const g=x.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.r*W/500);
g.addColorStop(0,'rgba(230,185,110,'+a+')');g.addColorStop(1,'rgba(230,185,110,0)');x.fillStyle=g;x.beginPath();x.arc(p.x*W,p.y*H,p.r*W/500,0,7);x.fill()}
for(const p of dust){p.y-=p.v*16;p.x+=Math.sin(t/2500+p.p)*.00006;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
const a=k*(.15+.55*Math.max(0,Math.sin(t/500+p.p*3)))*p.s;x.beginPath();x.fillStyle='rgba(238,200,125,'+a+')';x.shadowColor='#e8c27a';x.shadowBlur=7;x.arc(p.x*W,p.y*H,p.r*W/520,0,7);x.fill();x.shadowBlur=0}
requestAnimationFrame(loop)})(0);
let tm;
function play(){clearTimeout(tm);btn.style.opacity=0;st.classList.remove('go');void st.offsetWidth;t0=performance.now();st.classList.add('go');tm=setTimeout(()=>btn.style.opacity=1,13000)}
btn.onclick=play;st.onclick=play;play();
</script></body></html>
